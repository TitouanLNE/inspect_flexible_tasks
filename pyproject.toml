[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flexible_tasks"
version = "0.1.0"
description = "Custom dynamic wrappers for Inspect AI benchmarks"
dependencies = [
    "inspect_ai",
    "inspect_evals @ git+https://github.com/UKGovernmentBEIS/inspect_evals@main"
]

[tool.setuptools]
py-modules = ["flexible_tasks"]
include-package-data = true
